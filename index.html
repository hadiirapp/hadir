<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حاضر">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F3D3E">

<link rel="icon" href="icon.png">
<title>حاضر · Hadir</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5F4;--card:#fff;--ink:#14201F;--mute:#5E6F6D;--line:#DCE4E2;--brand:#0F3D3E;--on:#fff;--ok:#2F8F6B;--bad:#B5473A;--warn:#9A6212;--soft:#E7EFED}
@media(prefers-color-scheme:dark){:root{--bg:#0D1716;--card:#15211F;--ink:#E9F0EE;--mute:#93A6A3;--line:#243533;--brand:#6FC1B8;--on:#0D1716;--ok:#4CC08F;--bad:#E27A6C;--warn:#E0A94F;--soft:#1C2B29}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.55;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit}
main{max-width:560px;margin:0 auto;padding:0 16px 56px}
header{padding:12px 0 2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-size:1.5rem;font-weight:700;color:var(--brand)}
h2{margin:0 0 10px;font-size:1.02rem;font-weight:700}
.hb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.linkb{background:none;border:0;color:var(--mute);font-size:.88rem;padding:0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.sub,.mute{color:var(--mute);font-size:.88rem}
.tabs{display:flex;gap:4px;margin:10px 0 4px;background:var(--line);padding:4px;border-radius:12px}
.tabs button{flex:1;min-width:0;border:0;border-radius:9px;padding:9px 1px;font-weight:600;font-size:.8rem;line-height:1.2;background:transparent;color:var(--mute);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
textarea{min-height:110px;resize:vertical}
label.f,div.f{display:grid;gap:4px;color:var(--mute);font-size:.88rem}
.big{display:block;margin:22px auto 10px;width:min(60vw,220px);aspect-ratio:1;border-radius:50%;border:0;background:var(--brand);color:var(--on);font-weight:700;font-size:1.35rem;line-height:1.3;cursor:pointer;box-shadow:0 10px 30px rgba(15,61,62,.25);transition:transform .12s}
.big.in{background:var(--bad);box-shadow:0 10px 30px rgba(181,71,58,.25)}
.big:active{transform:scale(.96)}
.big:disabled{opacity:.6}
.state{text-align:center;font-weight:600}
.msg{min-height:1.4em;color:var(--ok);font-size:.92rem}
.msg.err{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list>.row:first-child{border-top:0}
.row.tap{cursor:pointer}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-inline-end:8px}
.btn{border:1px solid var(--brand);background:transparent;color:var(--brand);padding:10px 14px;border-radius:10px;font-weight:600;font-size:.95rem;cursor:pointer}
.btn.fill{background:var(--brand);color:var(--on)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.bad.fill{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:.84rem}
.btn.block{display:block;width:100%}
.btn:disabled{opacity:.5}
.g{display:grid;gap:10px}
.two{display:flex;gap:8px}
.two>*{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
.badge{display:inline-block;font-size:.72rem;line-height:1.6;padding:0 8px;border-radius:99px;background:var(--soft);color:var(--mute);margin-inline-start:6px;vertical-align:middle}
.badge.bad{color:var(--bad)}.badge.warn{color:var(--warn)}.badge.ok{color:var(--ok)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;color:inherit;font-size:1rem;cursor:pointer}
.list>.item:first-child{border-top:0}
.ck{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:.9rem;color:#fff;margin-top:1px}
.item.done .ck{background:var(--ok);border-color:var(--ok)}
.item.done .it{text-decoration:line-through;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:7px 12px;font-weight:600;font-size:.88rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);color:var(--on);border-color:var(--brand)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:var(--soft);border-radius:12px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-size:1.1rem}
.code{font-size:1.8rem;font-weight:700;letter-spacing:.12em}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.abar{position:sticky;top:0;z-index:20;background:var(--bad);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:600}
.abar button{background:#fff;color:#B5473A;border:0;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer;flex:none}
#sheet{position:fixed;inset:0;z-index:50}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet .sh{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
#sheet .x{position:absolute;top:12px;inset-inline-end:12px;border:0;background:var(--soft);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:1rem;cursor:pointer}
#sheet h2{padding-inline-end:40px}
pre.inv{white-space:pre-wrap;font-family:inherit;background:var(--soft);border-radius:12px;padding:12px;margin:10px 0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
a{color:var(--brand)}
.foot{text-align:center;margin-top:18px;font-size:.88rem}
@keyframes sp{to{transform:rotate(360deg)}}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
/* schedule grid */
.sg{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:16px;background:var(--card);-webkit-overflow-scrolling:touch}
.sgt{border-collapse:separate;border-spacing:0;width:100%;min-width:690px;table-layout:fixed;font-size:.78rem}
.sgt col.c0{width:118px}
.sgt th,.sgt td{padding:4px 3px;text-align:center;border-bottom:1px solid var(--line)}
.sgt thead th{font-weight:700;color:var(--mute);padding:8px 3px;background:var(--card)}
.sgt .dn{font-size:1rem;color:var(--ink)}
.sgt .nm{position:sticky;inset-inline-start:0;background:var(--card);z-index:2;text-align:start;padding-inline:8px;font-weight:600;white-space:normal;overflow-wrap:break-word;line-height:1.25;font-size:.76rem;unicode-bidi:plaintext;border-inline-end:1px solid var(--line)}
.sgt .grp td{background:var(--soft);color:var(--brand);font-weight:700;font-size:.8rem;letter-spacing:.02em}
.sgt .grp td.nm{background:var(--soft)}
.sgt .cnt td{color:var(--mute);font-size:.72rem}
.sgt th.tdy{color:var(--brand)}.sgt th.tdy .dn{color:var(--brand)}
.sgt td.tdy{background:rgba(111,193,184,.08)}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40px;border-radius:9px;padding:3px 2px;line-height:1.15;font-variant-numeric:tabular-nums;position:relative}
.cell b{font-weight:700}.cell span{font-size:.7rem;opacity:.8}
.cell[data-a]{cursor:pointer}
.c-am{background:rgba(79,155,255,.20)}.c-pm{background:rgba(52,199,163,.22)}.c-nt{background:rgba(155,115,255,.24)}.c-off{background:rgba(245,190,50,.32);color:#A06E00}
@media(prefers-color-scheme:dark){.c-off{color:#F2C24E}}
.ed{position:absolute;top:3px;inset-inline-end:3px;width:6px;height:6px;border-radius:50%;background:var(--brand)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:8px 4px 0;color:var(--mute);font-size:.78rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-inline-end:5px;vertical-align:-2px}
.c-yel{color:#A06E00}
@media(prefers-color-scheme:dark){.c-yel{color:#F2C24E}}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.08);cursor:pointer;padding:0}
.sw[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:2px}
.swrow{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.gdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px;vertical-align:0}
.nmTap{text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.sgt th[data-a]{cursor:pointer;text-decoration:underline dotted;text-underline-offset:4px}
.sec{border-inline-start:10px solid var(--line)}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);margin:4px;font-size:.95rem}
.fchip button{border:0;background:transparent;color:var(--mute);font-size:1rem;cursor:pointer;padding:2px 6px}
.fsec-ed{border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;border-inline-start-width:10px}

/* ===== Hadir design system v2 ===== */
:root{--bg:#F3F6F5;--card:#fff;--card2:#EDF2F0;--ink:#13201E;--mute:#5F716D;--line:rgba(16,40,36,.09);--brand:#1F7A6E;--on:#fff;--ok:#1F8F62;--bad:#C2473B;--warn:#A0670F;--soft:#EDF2F0;--blue:#2F67C4;--violet:#6B4FC8;--navbg:rgba(255,255,255,.94);--accT:rgba(31,122,110,.10)}
@media(prefers-color-scheme:dark){:root{--bg:#0B1211;--card:#141D1C;--card2:#1B2625;--ink:#EEF4F2;--mute:#8FA19C;--line:rgba(255,255,255,.07);--brand:#6FC6B8;--on:#06201C;--ok:#5FD3A5;--bad:#F0706A;--warn:#F2B84B;--soft:#1B2625;--blue:#8DB3F2;--violet:#C9B8F7;--navbg:rgba(15,23,22,.96);--accT:rgba(111,198,184,.12)}}
body{font-size:15px}
main{padding:0 16px calc(104px + env(safe-area-inset-bottom,0px))}
header{padding:16px 0 2px}
h1{font-size:1.85rem;letter-spacing:-.4px;color:var(--ink);line-height:1.2}
h1.brandT{color:var(--brand)}
#vn{font-size:.82rem;color:var(--mute);min-height:1.2em}
h2{font-size:1rem}
.card{border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:14px;min-height:44px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.fill{background:var(--brand);color:var(--on);border-color:transparent}
.btn.bad{color:var(--bad);background:rgba(240,112,106,.10);border-color:rgba(240,112,106,.28)}
.btn.bad.fill{background:var(--bad);color:#fff;border-color:transparent}
.btn.sm{min-height:36px;padding:6px 12px;border-radius:12px;font-size:.85rem}
.btn.block{display:flex;width:100%}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex:none;padding:0}
.ibtn.sm{width:38px;height:38px;border-radius:12px}
input,select,textarea{border-radius:14px;background:var(--card2);border:1px solid var(--line);min-height:46px}
.tabs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:12px 0 4px}
.tabs button{border-radius:11px;padding:10px 4px;font-size:.86rem}
.tabs button[aria-selected=true]{background:var(--card2);box-shadow:none}
.chip{background:transparent;border:1px solid var(--line);padding:8px 14px}
.chip[aria-pressed=true]{background:var(--brand);color:var(--on);border-color:transparent}
.badge{background:var(--card2);font-weight:600}
.badge.bad{background:rgba(240,112,106,.14)}.badge.warn{background:rgba(242,184,75,.16)}.badge.ok{background:rgba(95,211,165,.14)}
.kpi div{background:var(--card2);border-radius:14px;padding:12px 6px}
.kpi b{font-size:1.25rem}
.row{padding:12px 0}
.ico{display:inline-block;vertical-align:-3px;flex:none}
[dir=rtl] .flipx{transform:scaleX(-1)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;gap:4px}
.bnav button{flex:1;max-width:96px;border:0;background:transparent;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:14px;font-size:.72rem;font-weight:500;cursor:pointer;font-family:inherit;position:relative}
.bnav button[aria-selected=true]{color:var(--brand);background:var(--accT);font-weight:700}
.bnav .nb{position:absolute;top:5px;inset-inline-end:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
.grp{margin-top:18px}.grp>.gt{font-size:.78rem;color:var(--mute);font-weight:700;padding:0 6px 6px}
.grp>.card{margin-top:0;padding:0;overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 14px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.95rem;text-align:start;cursor:pointer;text-decoration:none;box-sizing:border-box}
.grp>.card>.srow:first-child{border-top:0}
.srow .ti{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.srow .sl{flex:1;min-width:0}
.srow .sv{color:var(--mute);font-size:.85rem;text-align:end}
.srow .ch{color:var(--mute);opacity:.6;display:flex}
.srow.danger{color:var(--bad)}
.tg{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;display:inline-block}.tg i{position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.tg.on{background:var(--brand)}.tg.on i{inset-inline-start:21px;background:var(--on)}
.t-teal{background:rgba(111,198,184,.16);color:var(--brand)}.t-blue{background:rgba(122,167,240,.16);color:var(--blue)}.t-amber{background:rgba(242,184,75,.16);color:var(--warn)}.t-violet{background:rgba(181,156,240,.16);color:var(--violet)}.t-red{background:rgba(240,112,106,.14);color:var(--bad)}.t-gray{background:var(--card2);color:var(--mute)}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex:none;background:var(--accT);color:var(--brand)}
.pcard{display:flex;align-items:center;gap:12px}
.ptag{font-size:.8rem;color:var(--mute)}

.ringT{width:204px;height:204px;border-radius:50%;border:10px solid var(--accT);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:4px auto 14px;box-sizing:border-box}
.ringT:before{content:"";position:absolute;inset:-10px;border-radius:50%;border:10px solid transparent;border-top-color:var(--brand);border-inline-start-color:var(--brand)}
.ringT .tt{font-size:2.6rem;font-weight:700;letter-spacing:-1px;line-height:1.1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--accT);color:var(--brand);font-size:.82rem;font-weight:600}
.big{width:min(58vw,208px);box-shadow:0 0 0 14px var(--accT)}
.big.in{box-shadow:0 0 0 14px rgba(240,112,106,.14)}
.donut{display:flex;align-items:center;gap:18px;margin-top:12px}
.donut .dc{position:relative;width:112px;height:112px;flex:none}
.donut .dc .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.leg{flex:1;display:flex;flex-direction:column;gap:9px}
.leg div{display:flex;align-items:center;gap:10px;font-size:.9rem}.leg i{width:10px;height:10px;border-radius:50%;flex:none}.leg span{flex:1;color:var(--mute)}
.att{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.att .ti{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.att .tx{flex:1;min-width:0}.att .tx b{display:block;font-size:.92rem;font-weight:600}.att .tx span{font-size:.8rem;color:var(--mute)}
.list .att:first-child,.att.first{border-top:0}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.mini .card{margin-top:0;cursor:pointer}
.mini .mt{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--mute)}
.mini .mv{font-size:1.25rem;font-weight:700;margin-top:6px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.list>.prow:first-child{border-top:0}
.prow .tx{flex:1;min-width:0}.prow .tx b{display:block;font-weight:600;font-size:.94rem}.prow .tx span{font-size:.8rem;color:var(--mute)}
.sbox{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--mute);flex:1}
.sbox input{border:0;background:transparent;min-height:44px;padding:0;color:var(--ink);outline:0}
.hrow{display:flex;gap:10px;margin-top:12px;align-items:center}
.fbar{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.fbar .chip{flex:none}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center}
.stat3>div+div{border-inline-start:1px solid var(--line)}
.stat3 b{display:block;font-size:1.3rem;font-weight:700}.stat3 span{font-size:.75rem;color:var(--mute)}
.sgt thead th{font-size:.72rem}.sgt .dn{font-size:.9rem}
.sicon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}

.cform .row{gap:10px}
.cin{display:flex;align-items:center;gap:6px;min-height:42px;padding:0 10px;border-radius:12px;background:var(--card2);border:1px solid var(--line);direction:ltr;flex:none;width:150px}
.cin span{font-size:.8rem;color:var(--mute)}.cin input{border:0;background:transparent;min-height:40px;padding:0;text-align:right;font-weight:600;outline:0;width:100%}
.cres{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;background:var(--card2);margin-top:12px}
.dpill{padding:6px 12px;border-radius:12px;font-weight:700;white-space:nowrap}
.dp-ok{background:rgba(95,211,165,.16);color:var(--ok)}.dp-short{background:rgba(240,112,106,.16);color:var(--bad)}.dp-over{background:rgba(242,184,75,.18);color:var(--warn)}
.slip .row b{font-variant-numeric:tabular-nums}
.slip .tot{font-size:1.1rem}

.steps{counter-reset:st;display:flex;flex-direction:column;gap:12px;margin-top:12px}
.steps div{display:flex;align-items:center;gap:12px;font-size:.95rem}
.steps div:before{counter-increment:st;content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--accT);color:var(--brand);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.steps .si{color:var(--brand);display:flex}

.ftiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.ftile{border-radius:18px;background:var(--card);border:1px solid var(--line);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-height:132px}
.ftile .fh{padding:10px 12px}.ftile .fh b{display:block;font-size:1rem}.ftile .fh span{font-size:.75rem;opacity:.8}
.ftile .fb{padding:8px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.ftile .fp{display:flex;align-items:center;gap:6px;font-size:.85rem}.ftile .fp .av{width:24px;height:24px;font-size:.62rem}
.ftile .fp button{margin-inline-start:auto;border:0;background:transparent;color:var(--mute);padding:2px 4px;cursor:pointer}
.ftile .fs{margin-top:auto;align-self:flex-start;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px}
.fs-ok{background:rgba(95,211,165,.16);color:var(--ok)}.fs-w{background:rgba(242,184,75,.18);color:var(--warn)}.fs-x{background:rgba(122,167,240,.16);color:var(--blue)}.fs-n{background:var(--card2);color:var(--mute)}
.qa{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:2px}
.qa button{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.tl{position:relative;margin-top:10px}
.tl .tr{display:flex;align-items:center;gap:8px;height:30px}
.tl .tn{width:88px;flex:none;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .tb{position:relative;flex:1;height:14px;border-radius:7px;background:var(--card2)}
.tl .ts{position:absolute;top:0;bottom:0;border-radius:7px;background:rgba(143,161,156,.35)}
.tl .ta{position:absolute;top:3px;bottom:3px;border-radius:5px;background:var(--brand)}
.tl .ta.late{background:var(--warn)}
.tl .now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bad);border-radius:2px}
.tl .tk{display:flex;justify-content:space-between;margin-inline-start:96px;font-size:.66rem;color:var(--mute);margin-bottom:2px}
.hbell .nb{position:absolute;top:8px;inset-inline-end:9px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
[hidden]{display:none!important}
</style>

async function fCopy(k){const d=floorDay,src=floorOf(bdAdd(d,-k));if(!Object.keys(src).length)return say(t('fCopyNone'),1);const ok=new Set(workingOn(d).map(w=>w.pid)),asg={};
  Object.entries(src).forEach(([s0,ps])=>{asg[s0]=ps.filter(p=>ok.has(p))});await saveFloor(d,asg);say(t('saved'))}
function autoAssign(d){const secs=secList(),asg=JSON.parse(JSON.stringify(floorOf(d))),has=new Set(Object.values(asg).flat()),hist={};
  for(let k=1;k<=7;k++)Object.entries(floorOf(bdAdd(d,-k))).forEach(([s0,ps])=>ps.forEach(p=>{hist[p+'|'+s0]=(hist[p+'|'+s0]||0)+(k===1?3:1)}));
  const todo=workingOn(d).filter(w=>!has.has(w.pid)).sort((a,b)=>a.p.name.localeCompare(b.p.name));let n=0;
  todo.forEach(w=>{const cand=secs.filter(x=>!(x.pos&&x.pos.length)||x.pos.includes(w.p.pos||''));if(!cand.length)return;let best=null,bs=1e9;
    cand.forEach(x=>{const c=(asg[x.id]||[]).length,need=+x.need||0,sc=(need?c/need:c+1)*10+(hist[w.pid+'|'+x.id]||0)*2;if(sc<bs){bs=sc;best=x}});
    (asg[best.id]=asg[best.id]||[]).push(w.pid);n++});return{asg,n}}

let cashMon={},cashMonKey='',cashTodayDoc=null,cashSubbed=false,cashDraft=null,repView='att';
const cashCur=()=>(V&&V.cashCur)||'usd';
const cashRate=()=>+(V&&V.cashRate)||89500;
const curFmt=(v,cur)=>cur==='lbp'?`${Math.round(v||0).toLocaleString('en-US')} ${lang==='ar'?'ل.ل':'LBP'}`:money(v);

function cashCalc(d){const cur=d.cur||'usd',rate=+d.rate||cashRate(),exp=(d.exp||[]).reduce((a,x)=>a+(+x.a||0),0);
  const counted=(+d.cashUsd||0)+(cur==='both'?(+d.cashLbp||0)/rate:0)+(+d.card||0)+(+d.wallet||0)+exp-(+d.float||0);
  return{counted,diff:counted-(+d.sales||0),exp,cur}}
function diffPill(diff,cur){const tol=+(V&&V.cashTol)||(cur==='lbp'?50000:1);if(Math.abs(diff)<=tol)return `<span class="dpill dp-ok">${t('cashBal')}</span>`;
  return diff<0?`<span class="dpill dp-short">${t('cashShort',curFmt(-diff,cur))}</span>`:`<span class="dpill dp-over">${t('cashOver',curFmt(diff,cur))}</span>`}
function cashSetSheet(){const c=cashCur();openSheet(`<h2>${t('cashSetT')}</h2><div class="g"><div class="f">${t('cashCurL')}<div class="chips">${[['usd',t('curUsd')],['lbp',t('curLbp')],['both',t('curBoth')]].map(([k,l])=>`<button type="button" class="chip ccur" data-a="pickOne" data-g="ccur" data-v="${k}" aria-pressed="${c===k}">${l}</button>`).join('')}</div></div>
  <label class="f">${t('cashRateL')}<input id="cr" inputmode="numeric" value="${cashRate()}"></label><label class="f">${t('cashFloatL')}<input id="cf" inputmode="decimal" value="${+(V.cashFloat||0)}"></label><label class="f">${t('cashTolL')}<input id="ct" inputmode="decimal" value="${+(V.cashTol||(c==='lbp'?50000:1))}"></label>

async function cashSetSave(){const b=document.querySelector('#sheet .ccur[aria-pressed="true"]'),cur=b?b.dataset.v:'usd';const num=id=>Math.max(0,+String($(id).value).replace(/[^0-9.]/g,'')||0);
  await updateDoc(vref(),{cashCur:cur,cashRate:num('cr')||89500,cashFloat:num('cf'),cashTol:num('ct')});closeSheet();say(t('saved'))}
function cashSheet(date,ex){const cur=ex?ex.cur||cashCur():cashCur();cashDraft=ex?{...ex,exp:(ex.exp||[]).map(x=>({...x}))}:{date,cur,rate:cashRate(),sales:'',cashUsd:'',cashLbp:'',card:'',wallet:'',float:+(V.cashFloat||0),exp:[],note:''};cashDraft.date=date;cashDraft.cur=cur;renderCashSheet(!!ex)}

function renderCashSheet(isEdit){const d=cashDraft,cur=d.cur,u=cur==='lbp'?'LL':'$',isAdmE=isEdit&&isAdm();

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[role=button]')){e.preventDefault();e.target.click();return}
  if(e.key==='Enter'&&e.target.id==='ni'){e.preventDefault();A.ladd();return}
  if(e.key==='Enter'&&e.target.id==='np2'){e.preventDefault();A.padd();return}
  if(e.key==='Enter'&&e.target.tagName==='INPUT'){const f=e.target.closest('#app,#sheet');const btn=f&&f.querySelector('.btn.fill:not([disabled])');if(btn){e.preventDefault();btn.click()}}
  if(e.key==='Escape'&&sheetOpen())closeSheet()});
