name: iOS TestFlight

# Runs when Ray pushes to the ios-build branch, or by hand from the Actions tab.
on:
  push:
    branches: [ios-build]
    paths: ['ios-app/**', '.github/workflows/ios-testflight.yml']
  workflow_dispatch:
    inputs:
      version:
        description: "App version shown in the store"
        required: true
        default: "1.0"

jobs:
  build:
    # Intel runner: Apple-silicon runners are often queued for a long time.
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios-app
    env:
      RAW_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      RAW_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      RAW_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_NO: ${{ github.run_number }}
      APP_VERSION: ${{ inputs.version || '1.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean up secret values
        run: |
          for v in KEY_ID:ASC_KEY_ID ISSUER_ID:ASC_ISSUER_ID TEAM_ID:TEAM_ID; do
            raw="RAW_${v%%:*}"; val=$(printf '%s' "${!raw}" | tr -d '[:space:]')
            [ -n "$val" ] || { echo "::error::secret for ${v#*:} is empty"; exit 1; }
            echo "::add-mask::$val"; echo "${v#*:}=$val" >> "$GITHUB_ENV"
          done

      - name: Pick Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; else echo "::warning::Xcode 26 not found, using default"; fi
          xcodebuild -version

      - name: Install web deps and sync
        run: |
          ci/run.sh npm npm ci
          ci/run.sh cap npx cap sync ios

      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          P8="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8" | base64 --decode > "$P8"
          grep -q "BEGIN PRIVATE KEY" "$P8" || { echo "::error::ASC_KEY_P8 secret is not a valid base64 key"; exit 1; }
          echo "P8_PATH=$P8" >> "$GITHUB_ENV"

      - name: Signing certificate and profile
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" ci/sign.py "$RUNNER_TEMP/sign"

      - name: Keychain
        run: |
          KC="$RUNNER_TEMP/ci.keychain-db"; KPW=$(uuidgen)
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          curl -sSfL -o "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/wwdr.cer" -k "$KC" -A || true
          security import "$RUNNER_TEMP/sign/cert.p12" -P "$P12_PW" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$RUNNER_TEMP/sign/profile.mobileprovision" "$d/$PROFILE_UUID.mobileprovision"
          done

      - name: Manual signing for the App target
        run: |
          python3 - <<'PY'
          import os
          p = 'ios/App/App.xcodeproj/project.pbxproj'
          s = open(p).read()
          head = '504EC3181FED79650016851F /* Release */ = {'
          i = s.index(head); j = s.index('name = Release;', i)
          blk = s[i:j]
          new = blk.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";\n\t\t\t\tDEVELOPMENT_TEAM = %s;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "%s";' % (os.environ['TEAM_ID'], os.environ['PROFILE_NAME']))
          new = new.replace('CURRENT_PROJECT_VERSION = 1;', 'CURRENT_PROJECT_VERSION = %s;' % os.environ['BUILD_NO'])
          new = new.replace('MARKETING_VERSION = 1.0;', 'MARKETING_VERSION = %s;' % os.environ['APP_VERSION'])
          assert new != blk
          open(p, 'w').write(s[:i] + new + s[j:])
          print('signing set for build', os.environ['BUILD_NO'])
          PY

      - name: Archive
        run: |
          ci/run.sh archive xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation archive

      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.usehadir.app</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          ci/run.sh upload xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$P8_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/ci.keychain-db" 2>/dev/null || true
