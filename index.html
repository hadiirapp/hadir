[hidden]{display:none!important}

const clearSessions=()=>{try{Object.keys(localStorage).filter(k=>k.startsWith('hadir-s-')).forEach(k=>localStorage.removeItem(k))}catch(e){}};
const saveSession=()=>{if(U&&V)lsSet('hadir-s-'+U.uid,JSON.stringify({U,V}))};
async function boot(u){stop();const my=++bootSeq;if(!u){clearSessions();return loginView()}
  if((u.email||'').toLowerCase()===BOSS){clearSessions();U={uid:u.uid,role:'boss',name:'Hadir'};V=null;bossList=null;bootAt=Date.now();say('');render();return}
  let c=null;try{c=JSON.parse(lsGet('hadir-s-'+u.uid)||'null')}catch(e){}
  if(c&&c.U&&c.V&&c.U.uid===u.uid){start(c.U,c.V);
    getDoc(doc(db,'users',u.uid)).then(us=>{if(my!==bootSeq)return;if(!us.exists()){clearSessions();signOut(auth);return}const nu=resolveU(u.uid,us.data());
      if(nu.disabled){clearSessions();signOut(auth).then(()=>say(t('suspended'),1));return}
      if(nu.venueId!==c.U.venueId||nu.role!==c.U.role||JSON.stringify(nu.perms||null)!==JSON.stringify(c.U.perms||null)){lsSet('hadir-s-'+u.uid,'');boot(u)}else{U=nu;saveSession();render()}}).catch(()=>{});return}
  loadingView();
  try{const us=await getDoc(doc(db,'users',u.uid));if(my!==bootSeq)return;if(!us.exists()){await signOut(auth);loginView();return say(t('notLinked'),1)}
    const U0=resolveU(u.uid,us.data());if(U0.disabled){await signOut(auth);loginView();return say(t('suspended'),1)}const vs=await getDoc(doc(db,'venues',U0.venueId));if(my!==bootSeq)return;
    start(U0,{id:vs.id,...vs.data()});saveSession()}catch(e){if(my!==bootSeq)return;loginView();say(errT(e),1)}}
function start(U0,V0){stop();U=U0;V=V0;bootAt=Date.now();say('');payMap={};payLoaded=false;migrated=false;mgrs=[];
    sub(vref(),s=>{if(s.exists()){V={id:s.id,...s.data()};saveSession();render()}});
    if(isAdm()){syncEmail();
      sub(doc(db,'users',U.uid),s=>{if(!s.exists())return;const d=s.data();if(d.disabled){clearSessions();signOut(auth).then(()=>say(t('suspended'),1));return}
        if(JSON.stringify(d.perms||null)!==JSON.stringify(U.perms||null)){U.perms=d.perms;saveSession();boot(auth.currentUser)}});
      if(canPay())sub(col('pay'),s=>{payMap={};s.docs.forEach(d=>{payMap[d.id]=d.data()});payLoaded=true;migratePay();render()});
      if(isOwner()){loadBranches();sub(query(collection(db,'users'),where('venueId','==',V.id),where('role','==','admin')),s=>{mgrs=s.docs.map(d=>({...d.data(),id:d.id}));render()})}
      const patch={};if(V.cutoff==null)patch.cutoff='05:00';if(V.grace==null)patch.grace=10;if(V.radius==null)patch.radius=100;if(!V.lists)patch.lists=defaultLists();if(!V.alertTypes)patch.alertTypes=defaultAlerts();if(!V.pingTypes)patch.pingTypes=defaultPings();if(!V.positions)patch.positions=defaultPositions();
      if(Object.keys(patch).length){Object.assign(V,patch);updateDoc(vref(),patch).catch(e=>say(errT(e),1))}
      sub(col('staff'),s=>{staff=s.docs.map(d=>({...d.data(),id:d.id}));migratePay();render()});
      const n=new Date(),ls=new Date(n.getFullYear(),n.getMonth(),1);ls.setDate(ls.getDate()-2);
      sub(query(col('logs'),where('inAt','>=',ls)),s=>{logs=s.docs.map(norm);render()});
      sub(query(col('alerts'),where('at','>=',new Date(Date.now()-864e5))),s=>{s.docChanges().forEach(c=>{if(c.type==='added'){const a=nal(c.doc);if(!a.ackAt&&a.at>bootAt-5000)beep()}});alerts=s.docs.map(nal);render()});
      const d9=new Date();d9.setDate(d9.getDate()-9);
      sub(query(col('checks'),where('date','>=',ymd(d9))),s=>{checks=s.docs.map(nck);render()});
      {const w6=new Date();w6.setDate(w6.getDate()-42);sub(query(col('sched'),where('week','>=',weekOf(ymd(w6)))),s=>{scheds={};s.docs.forEach(d=>{scheds[d.id]=d.data()});render()})}
      sub(query(col('leaves'),where('at','>=',new Date(Date.now()-60*864e5))),s=>{leaves=s.docs.map(nau);render()});
      sub(query(col('swaps'),where('at','>=',new Date(Date.now()-60*864e5))),s=>{swaps=s.docs.map(nau);render()});
      sub(query(col('pings'),where('at','>=',new Date(Date.now()-864e5))),s=>{pings=s.docs.map(npg);render()});
      sub(query(col('audit'),where('at','>=',new Date(Date.now()-70*864e5))),s=>{audit=s.docs.map(nau);if(curPerson&&sheetOpen()&&document.activeElement===document.body)personSheet(curPerson)});
    }else{
      sub(doc(db,'venues',V.id,'staff',U.uid),s=>{ME=s.data()||{};if(ME.active===false){clearSessions();signOut(auth).then(()=>say(t('suspended'),1));return}render()});
      {const since=new Date(Date.now()-40*864e5),onS=s=>{logs=s.docs.map(norm);render()};
       un.push(onSnapshot(query(col('logs'),where('uid','==',U.uid),where('inAt','>=',since)),onS,e=>{if(e&&e.code==='failed-precondition')sub(query(col('logs'),where('uid','==',U.uid)),onS);else say(errT(e),1)}))}
      sub(query(col('alerts'),where('uid','==',U.uid)),s=>{alerts=s.docs.map(nal);render()});
      {const w1=new Date();w1.setDate(w1.getDate()-8);sub(query(col('sched'),where('week','>=',weekOf(ymd(w1)))),s=>{scheds={};s.docs.forEach(d=>{scheds[d.id]=d.data()});render()})}
      sub(query(col('leaves'),where('uid','==',U.uid)),s=>{leaves=s.docs.map(nau);render()});
      sub(query(col('swaps'),where('a','==',U.uid)),s=>{swA=s.docs.map(nau);swaps=[...swA,...swB];render()});
      sub(query(col('swaps'),where('b','==',U.uid)),s=>{swB=s.docs.map(nau);swaps=[...swA,...swB];render()});
      sub(query(col('pings'),where('to','==',U.uid)),s=>{s.docChanges().forEach(c=>{if(c.type==='added'){const p=npg(c.doc);if(!p.seenAt&&p.at>bootAt-5000)beep()}});pings=s.docs.map(npg);render()});
      const d2=new Date();d2.setDate(d2.getDate()-2);
      sub(query(col('checks'),where('date','>=',ymd(d2))),s=>{checks=s.docs.map(nck);render()});
    }
    render()}
onAuthStateChanged(auth,u=>{if(!creating)boot(u)});
setInterval(render,30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&U&&Date.now()-bootAt>12*36e5)boot(auth.currentUser);else if(document.visibilityState==='visible')render()});

/* ---------- actions ---------- */
const guard=f=>async b=>{if(busy)return;busy=true;if(b)b.disabled=true;try{await f(b)}catch(e){const m=errT(e);if(sheetOpen()&&$('smsg'))smsg(m);else say(m,1)}finally{busy=false;if(b&&b.isConnected)b.disabled=false}};
const A={
  lang:()=>{lang=lang==='ar'?'en':'ar';lsSet('hadir-lang',lang);applyLang();if(sheetOpen())closeSheet();U?render():loginView()},
  logout:()=>{closeSheet();clearSessions();signOut(auth)},
  mode:b=>{mode=b.dataset.k;say('');loginView()},
  tab:b=>{tab=b.dataset.k;if(tab==='boss')bossList=null;if(tab==='all')ovData=null;render();scrollTo(0,0)},
  stab:b=>{stab=b.dataset.k;render()},
  ltype:b=>{ltype=b.dataset.k;render()},
  goLists:b=>{ltype=b.dataset.k;tab='lists';render();scrollTo(0,0)},
  dismiss:b=>{lsSet('hadir-d-'+b.dataset.k,'1');render()},
  closeSheet:()=>closeSheet(),
  chip:b=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true'),
  achip:b=>{document.querySelectorAll('#sheet .ach').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')},
  login:guard(doLogin),signup:guard(doSignup),punch:guard(punch),
  tick:guard(tick),listSheet:()=>listSheet(),
  lmv:b=>{const k=+b.dataset.k,d=+b.dataset.d,j=k+d;if(j<0||j>=draft.length)return;[draft[k],draft[j]]=[draft[j],draft[k]];renderListSheet()},
  ldel:b=>{draft.splice(+b.dataset.k,1);renderListSheet()},
  ladd:()=>{const v=$('ni').value.trim();if(!v)return;draft.push({id:'i'+rid(),t:v.slice(0,120)});renderListSheet();setTimeout(()=>{const n=$('ni');if(n)n.focus()},0)},
  lsave:guard(async()=>{await updateDoc(vref(),{['lists.'+ltype]:draft});closeSheet();say(t('saved'))}),
  ack:guard(async b=>{await updateDoc(doc(db,'venues',V.id,'alerts',b.dataset.id),{ackAt:serverTimestamp(),ackBy:myName()})}),
  shareCode:()=>shareText(t('inviteCode',APP_URL,V.code)),
  shareInvite:()=>shareText(lastInvite),
  addSheet:()=>openSheet(`<h2>${t('addStaff').replace('+ ','')}</h2>${staffForm(null)}<button class="btn fill block" style="margin-top:12px" data-a="addStaff">${t('save')}</button>`),
  addStaff:guard(addStaff),staffSheet:b=>staffSheet(b.dataset.id),saveStaff:guard(saveStaff),toggleStaff:guard(toggleStaff),
  reissueSheet:()=>reissueSheet(),reissue:guard(reissue),
  mprev:()=>{repM--;if(repM<0){repM=11;repY--}render()},
  mnext:()=>{if(isCurMonth())return;repM++;if(repM>11){repM=0;repY++}render()},
  person:b=>personSheet(b.dataset.id),editLog:b=>editLogSheet(b.dataset.id),saveLog:guard(saveLog),
  manualSheet:b=>manualSheet(b.dataset.id),saveManual:guard(saveManual),
  backPerson:()=>{curPerson?personSheet(curPerson):closeSheet()},
  shareRep:()=>shareRep(),csv:()=>exportCSV(),
  setSheet:()=>setSheet(),saveSet:guard(saveSet),setLoc:guard(setLoc),
  passSheet:()=>passSheet(),changePass:guard(changePass),
  alertSheet:()=>alertSheet(),sendAlert:guard(sendAlert),
  bExt:guard(bExt),bTog:guard(bTog),bAdminSheet:b=>bAdminSheet(b.dataset.id),bAdminSave:guard(bAdminSave),
  pingSheet:b=>pingSheet(b.dataset.id),sendPing:guard(sendPing),
  seen:guard(async b=>{await updateDoc(doc(db,'venues',V.id,'pings',b.dataset.id),{seenAt:serverTimestamp()})}),
  goTab:b=>{tab=b.dataset.k;render();scrollTo(0,0)},
  wprev:()=>{schedWk=bdAdd(schedWk,-7);render()},wnext:()=>{schedWk=bdAdd(schedWk,7);render()},
  cell:b=>cellSheet(b.dataset.p,b.dataset.d),cellOff:guard(()=>setCell('off')),cellDef:guard(()=>setCell(null)),
  cellSave:guard(async()=>{const a=$('cs').value,e=document.querySelector('#sheet .ecl[aria-pressed="true"]')?'close':$('ce').value;if(!a||!e)return smsg(t('fillAll'));await setCell(`${a}-${e}`)}),
  wcopy:guard(wcopy),wpub:guard(wpub),wshare:()=>wshare(),
  lvOk:guard(b=>leaveDecide(b.dataset.id,true)),lvNo:guard(b=>leaveDecide(b.dataset.id,false)),
  swOk:guard(b=>swapDecide(b.dataset.id,true)),swNo:guard(b=>swapDecide(b.dataset.id,false)),
  seeSched:b=>{lsSet('hadir-ws-'+V.id+b.dataset.k,'1');stab='sched';render();scrollTo(0,0)},
  leaveSheet:()=>leaveSheet(),leaveSend:guard(leaveSend),
  swapSheet:()=>{swD={d1:'',b:'',d2:''};swapSheet()},swD1:b=>{swD={d1:b.dataset.v,b:'',d2:''};swapSheet()},
  swB:b=>{swD.b=b.dataset.v;swD.d2='';swapSheet()},swD2:b=>{swD.d2=b.dataset.v;swapSheet()},swapSend:guard(swapSend),
  swAcc:guard(async b=>{await updateDoc(doc(db,'venues',V.id,'swaps',b.dataset.id),{status:'accepted'});say(t('saved'))}),
  swDec:guard(async b=>{await updateDoc(doc(db,'venues',V.id,'swaps',b.dataset.id),{status:'declined'});say(t('saved'))}),
  swCancel:guard(async b=>{await updateDoc(doc(db,'venues',V.id,'swaps',b.dataset.id),{status:'cancelled'})}),
  lvCancel:guard(async b=>{await updateDoc(doc(db,'venues',V.id,'leaves',b.dataset.id),{status:'cancelled'})}),
  paySheet:guard(paySheet),cfgSheet:guard(cfgSheet),cfgSave:guard(cfgSave),
  copy:async b=>{try{await navigator.clipboard.writeText(b.dataset.v);b.textContent='✓'}catch(e){window.prompt('',b.dataset.v)}},
  branchSheet:()=>branchSheet(),switchBranch:b=>switchBranch(b.dataset.id),newBranchSheet:()=>newBranchSheet(),newBranchSave:guard(newBranchSave),
  ovRefresh:()=>{ovData=null;render()},
  mgrSheet:b=>mgrSheet(b.dataset.id),mgrSave:guard(mgrSave),mgrToggle:guard(mgrToggle),mgrAddSheet:()=>mgrAddSheet(),mgrAdd:guard(mgrAdd),
  bOwnerSheet:b=>bOwnerSheet(b.dataset.id),bOwnerSave:guard(bOwnerSave),
  devReq:guard(async()=>{await updateDoc(doc(db,'venues',V.id,'staff',U.uid),{devReq:myDev(),devReqAt:serverTimestamp()});say(t('devReqSent'))}),
  devOk:guard(async b=>{const p=staff.find(x=>x.id===b.dataset.id);if(!p)return;await updateDoc(doc(db,'venues',V.id,'staff',p.id),{device:p.devReq,devReq:deleteField(),devReqAt:deleteField()});say(t('saved'))}),
  devNo:guard(async b=>{await updateDoc(doc(db,'venues',V.id,'staff',b.dataset.id),{devReq:deleteField(),devReqAt:deleteField()});say(t('saved'))}),
  devUnbind:guard(async()=>{await updateDoc(doc(db,'venues',V.id,'staff',editingStaff),{device:deleteField(),devReq:deleteField(),devReqAt:deleteField()});closeSheet();say(t('saved'))}),
  wshareImg:guard(()=>shareImg(schedWk,adminList())),
  imgShare:async()=>{if(!lastImg)return;const f=new File([lastImg],'schedule.png',{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(lastImg);a.download='schedule.png';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1500)},
  achipP:b=>{const ty=$('spn');if(ty)ty.value='';const on=b.getAttribute('aria-pressed')==='true';document.querySelectorAll('#sheet .psel').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed',on?'false':'true')},
  msView:b=>{msView=b.dataset.k;render()},
  posSheet:()=>posSheet(),psave:guard(psave),
  pren:b=>{const k=+b.dataset.k,old=posDraft[k],nv=(window.prompt(t('renamePos'),old)||'').trim().slice(0,30);if(!nv||nv===old||posDraft.includes(nv))return;posDraft[k]=nv;const orig=Object.keys(posRen).find(o=>posRen[o]===old)||old;posRen[orig]=nv;renderPosSheet()},
  pmv:b=>{const k=+b.dataset.k,j=k+(+b.dataset.d);if(j<0||j>=posDraft.length)return;[posDraft[k],posDraft[j]]=[posDraft[j],posDraft[k]];renderPosSheet()},
  pdel:b=>{posDraft.splice(+b.dataset.k,1);renderPosSheet()},
  padd:()=>{const v=($('np2').value||'').trim().slice(0,30);if(!v||posDraft.includes(v))return;posDraft.push(v);renderPosSheet();setTimeout(()=>{const n=$('np2');if(n)n.focus()},0)},
  colorSheet:()=>colorSheet(),csave:guard(csave),
  cmode:b=>{cDraft.mode=b.dataset.k;renderColorSheet()},
  cpick:b=>{cDraft[b.dataset.g][b.dataset.k]=b.dataset.v;renderColorSheet()},
  rowSheet:b=>rowSheet(b.dataset.p),rowApply:guard(rowApply),dayCopySheet:b=>dayCopySheet(b.dataset.d),dayCopy:guard(dayCopy),
  forgotSheet:()=>forgotSheet(),forgotSend:guard(forgotSend),linkEmailSheet:()=>linkEmailSheet(),linkEmailSend:guard(linkEmailSend),
  bNewVenueSheet:()=>bNewVenueSheet(),bNewVenueSave:guard(bNewVenueSave),
  consentOk:()=>{lsSet('hadir-consent','1');closeSheet();A.punch(null)}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){e.preventDefault();A[b.dataset.a](b)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[role=button]')){e.preventDefault();e.target.click();return}
  if(e.key==='Enter'&&e.target.id==='ni'){e.preventDefault();A.ladd();return}
  if(e.key==='Enter'&&e.target.id==='np2'){e.preventDefault();A.padd();return}
  if(e.key==='Enter'&&e.target.tagName==='INPUT'){const f=e.target.closest('#app,#sheet');const btn=f&&f.querySelector('.btn.fill:not([disabled])');if(btn){e.preventDefault();btn.click()}}
  if(e.key==='Escape'&&sheetOpen())closeSheet()});
</script>
