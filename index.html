<style>
:root{--bg:#F1F5F4;--card:#fff;--ink:#14201F;--mute:#5E6F6D;--line:#DCE4E2;--brand:#0F3D3E;--on:#fff;--ok:#2F8F6B;--bad:#B5473A;--warn:#9A6212;--soft:#E7EFED}
@media(prefers-color-scheme:dark){:root{--bg:#0D1716;--card:#15211F;--ink:#E9F0EE;--mute:#93A6A3;--line:#243533;--brand:#6FC1B8;--on:#0D1716;--ok:#4CC08F;--bad:#E27A6C;--warn:#E0A94F;--soft:#1C2B29}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.55;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit}
main{max-width:560px;margin:0 auto;padding:0 16px 56px}
header{padding:12px 0 2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-size:1.5rem;font-weight:700;color:var(--brand)}
h2{margin:0 0 10px;font-size:1.02rem;font-weight:700}
.hb{display:flex;gap:6px;align-items:center}
.sub,.mute{color:var(--mute);font-size:.88rem}
.tabs{display:flex;gap:4px;margin:10px 0 4px;background:var(--line);padding:4px;border-radius:12px}
.tabs button{flex:1;min-width:0;border:0;border-radius:9px;padding:9px 2px;font-weight:600;font-size:.86rem;line-height:1.2;background:transparent;color:var(--mute);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
textarea{min-height:110px;resize:vertical}
label.f,div.f{display:grid;gap:4px;color:var(--mute);font-size:.88rem}
.big{display:block;margin:22px auto 10px;width:min(60vw,220px);aspect-ratio:1;border-radius:50%;border:0;background:var(--brand);color:var(--on);font-weight:700;font-size:1.35rem;line-height:1.3;cursor:pointer;box-shadow:0 10px 30px rgba(15,61,62,.25);transition:transform .12s}
.big.in{background:var(--bad);box-shadow:0 10px 30px rgba(181,71,58,.25)}
.big:active{transform:scale(.96)}
.big:disabled{opacity:.6}
.state{text-align:center;font-weight:600}
.msg{min-height:1.4em;color:var(--ok);font-size:.92rem}
.msg.err{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list>.row:first-child{border-top:0}
.row.tap{cursor:pointer}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-inline-end:8px}
.btn{border:1px solid var(--brand);background:transparent;color:var(--brand);padding:10px 14px;border-radius:10px;font-weight:600;font-size:.95rem;cursor:pointer}
.btn.fill{background:var(--brand);color:var(--on)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.bad.fill{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:.84rem}
.btn.block{display:block;width:100%}
.btn:disabled{opacity:.5}
.g{display:grid;gap:10px}
.two{display:flex;gap:8px}
.two>*{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
.badge{display:inline-block;font-size:.72rem;line-height:1.6;padding:0 8px;border-radius:99px;background:var(--soft);color:var(--mute);margin-inline-start:6px;vertical-align:middle}
.badge.bad{color:var(--bad)}.badge.warn{color:var(--warn)}.badge.ok{color:var(--ok)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;color:inherit;font-size:1rem;cursor:pointer}
.list>.item:first-child{border-top:0}
.ck{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:.9rem;color:#fff;margin-top:1px}
.item.done .ck{background:var(--ok);border-color:var(--ok)}
.item.done .it{text-decoration:line-through;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:7px 12px;font-weight:600;font-size:.88rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);color:var(--on);border-color:var(--brand)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:var(--soft);border-radius:12px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-size:1.1rem}
.code{font-size:1.8rem;font-weight:700;letter-spacing:.12em}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.abar{position:sticky;top:0;z-index:20;background:var(--bad);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:600}
.abar button{background:#fff;color:#B5473A;border:0;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer;flex:none}
#sheet{position:fixed;inset:0;z-index:50}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet .sh{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
#sheet .x{position:absolute;top:12px;inset-inline-end:12px;border:0;background:var(--soft);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:1rem;cursor:pointer}
#sheet h2{padding-inline-end:40px}
pre.inv{white-space:pre-wrap;font-family:inherit;background:var(--soft);border-radius:12px;padding:12px;margin:10px 0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
a{color:var(--brand)}
.foot{text-align:center;margin-top:18px;font-size:.88rem}
@keyframes sp{to{transform:rotate(360deg)}}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
[hidden]{display:none!important}
</style>
</head>

/* ---------- business-day logic ---------- */
const cutMin=()=>hmMin((V&&V.cutoff)||'05:00');
function bizDate(ms){const d=new Date(ms);if(d.getHours()*60+d.getMinutes()<cutMin())d.setDate(d.getDate()-1);return ymd(d)}
function cutoffAt(inMs){const c=cutMin();const b=new Date(inMs+36e5);const x=new Date(b);x.setHours(Math.floor(c/60),c%60,0,0);if(x<b)x.setDate(x.getDate()+1);return +x}
const isStale=x=>!x.o&&Date.now()>cutoffAt(x.t);
const effEnd=x=>x.o||Math.min(Date.now(),cutoffAt(x.t));
function startMoment(bd,s){if(!s||!s.start)return null;const [y,m,d]=bd.split('-').map(Number);const sm=hmMin(s.start);const z=new Date(y,m-1,d,Math.floor(sm/60),sm%60);if(sm<cutMin())z.setDate(z.getDate()+1);return +z}
function endMoment(bd,s){const st=startMoment(bd,s);if(st==null)return null;let diff=hmMin(s.end||s.start)-hmMin(s.start);if(diff<=0)diff+=1440;return st+diff*6e4}
function lateMin(x,s){const st=startMoment(bizDate(x.t),s);if(st==null)return 0;const l=Math.floor((x.t-st)/6e4);return l>((V&&V.grace)??10)?l:0}
function sumLogs(ls,s){let ms=0,late=0,open=0;const days=new Set();for(const x of ls){ms+=Math.max(0,effEnd(x)-x.t);if(isStale(x))open++;days.add(bizDate(x.t));late+=lateMin(x,s)}return{ms,late,open,days:days.size}}

  if(U.role!=='admin'){const p=pings.filter(x=>!x.seenAt&&Date.now()-x.at<12*36e5).sort((a,b)=>b.at-a.at);if(!p.length){b.hidden=true;return}const x=p[0];b.hidden=false;

  const u=alerts.filter(a=>!a.ackAt&&Date.now()-a.at<864e5).sort((a,b)=>b.at-a.at);
  if(!u.length){b.hidden=true;return}const a=u[0];b.hidden=false;
  b.innerHTML=`<span>🚨 ${esc(a.name)} · ${esc(a.type)}${a.note?': '+esc(a.note):''} <span class="num">${tm(a.at)}</span>${u.length>1?` (+${u.length-1})`:''}</span><button data-a="ack" data-id="${esc(a.id)}">${t('ack')}</button>`}
function logRow(x,s,ed){const l=lateMin(x,s),b=[];
  if(isStale(x))b.push(`<span class="badge bad">${t('missing')}</span>`);else if(!x.o)b.push(`<span class="badge ok">${t('now')}</span>`);

    if(logs.some(x=>u.includes(x.uid)&&bizDate(x.t)===today))return null;const l=Math.floor((now-st)/6e4);if(l<=g||now>en)return null;return{p,l}}).filter(Boolean);

  h+=`<div class="card"><div class="top" style="margin-bottom:6px"><h2 style="margin:0">${t('inVenue',inn.length)}</h2>${inn.length>1?`<button class="btn sm" data-a="pingSheet" data-id="*">${t('pingAll')}</button>`:''}</div><div class="list">${inn.length?inn.map(x=>{const lp=lastPing(x.uid);return `<div class="row"><span><i class="dot"></i>${esc(nameOf(x))}<div class="mute num">${tm(x.t)} · ${dur(now-x.t)}${lp?` · ${lp.seenAt?'✓ '+tm(lp.seenAt):'⏳ '+tm(lp.at)}`:''}</div></span><button class="btn sm" data-a="pingSheet" data-id="${esc(x.uid)}" aria-label="message">🔔</button></div>`}).join(''):`<div class="mute">${t('nobody')}</div>`}</div></div>`;

  if(late.length)h+=`<div class="card"><h2>${t('lateToday',late.length)}</h2><div class="list">${late.map(z=>`<div class="row"><span>${esc(nameOf(z.x))}</span><span class="mute num">${tm(z.x.t)} · <span style="color:var(--warn)">${t('lateBy',z.l)}</span></span></div>`).join('')}</div></div>`;
  if(lost.length)h+=`<div class="card"><h2>${t('noOut',lost.length)}</h2><div class="list">${lost.map(x=>`<div class="row"><span>${esc(nameOf(x))}<div class="mute">${bdS(bizDate(x.t))} · <span class="num">${tm(x.t)}</span></div></span><button class="btn sm" data-a="editLog" data-id="${esc(x.id)}">${t('fix')}</button></div>`).join('')}</div><div class="mute" style="margin-top:6px">${t('noOutHint')}</div></div>`;
  const pr=ty=>{const it=(V.lists&&V.lists[ty])||[];const c=checks.find(z=>z.id===today+'_'+ty);const dn=(c&&c.done)||{};const n=it.filter(i=>dn[i.id]).length;const p=it.length?Math.round(n*100/it.length):0;return `<div class="row tap" data-a="goLists" data-k="${ty}"><span style="flex:1">${ty==='open'?t('open'):t('close')}<div class="bar"><i style="width:${p}%"></i></div></span><b class="num">${n}/${it.length}</b></div>`};
  h+=`<div class="card"><h2>${t('todayLists')}</h2><div class="list">${pr('open')}${pr('close')}</div></div>`;
  return h}

  const s=new Date(repY,repM,1);s.setDate(s.getDate()-1);const e=new Date(repY,repM+1,2);
  try{const q=await getDocs(query(col('logs'),where('inAt','>=',s),where('inAt','<',e)));if(repLogKey===k){repLogs=q.docs.map(norm);render()}}catch(er){repLogKey='';say(errT(er),1)}}

/* ---------- owner (Hadir) panel ---------- */
async function loadBoss(){const q=await getDocs(collection(db,'venues'));bossList=q.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>String(a.name).localeCompare(String(b.name)));render()}
function viewBoss(){if(!bossList){loadBoss().catch(e=>say(errT(e),1));return `<div class="card mute">${t('loading')}</div>`}
  return `<div class="card mute">${t('bHint')}</div><div class="card"><h2>${t('aBoss')} (${bossList.length})</h2><div class="list">${bossList.map(v=>{const si=subInfo(v);
    const st=si.pending?`<span class="badge warn">${t('bPending')}</span>`:si.susp?`<span class="badge bad">${t('bSusp')}</span>`:!si.pu?`<span class="badge">${t('bNoEnd')}</span>`:si.state==='blocked'?`<span class="badge bad">${t('bExpired',dateS(si.pu))}</span>`:si.state==='grace'?`<span class="badge warn">${t('bGrace',dateS(si.pu))}</span>`:`<span class="badge ${si.state==='soon'?'warn':'ok'}">${t('bActive',dateS(si.pu),si.days)}</span>`;
    return `<div class="row"><span>${esc(v.name)} <span class="mute ltr num">${esc(v.code)}</span><div>${st}</div></span><span class="hb"><button class="btn sm fill" data-a="bExt" data-id="${esc(v.id)}">${t('bExt')}</button>${si.pending?'':`<button class="btn sm${si.susp?'':' bad'}" data-a="bTog" data-id="${esc(v.id)}">${si.susp?t('bResume'):t('bSuspend')}</button>`}</span></div>`}).join('')}</div></div>`}
async function bExt(b){const v=bossList.find(x=>x.id===b.dataset.id);if(!v)return;const base=Math.max(Date.now(),tsMs(v.paidUntil)||0);const d=new Date(base);d.setMonth(d.getMonth()+1);
  await updateDoc(doc(db,'venues',v.id),{paidUntil:Timestamp.fromDate(d),status:'active'});say(t('saved'));await loadBoss()}
async function bTog(b){const v=bossList.find(x=>x.id===b.dataset.id);if(!v)return;const susp=v.status==='suspended';if(!susp&&!confirm(t('bConfirm',v.name)))return;
  await updateDoc(doc(db,'venues',v.id),{status:susp?'active':'suspended'});say(t('saved'));await loadBoss()}

/* ---------- admin: settings ---------- */
function viewSettings(){const si=subInfo();return `<div class="card g"><h2 style="margin:0">${t('subTitle')}</h2><div class="${si.state==='ok'?'mute':'msg err'}">${si.pending?t('bPending'):si.susp?t('bSusp'):si.pu?t('subUntil',dateS(si.pu)):t('subNoEnd')}</div><a class="btn" href="${waLink()}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">${t('renew')}</a></div>
  <div class="card"><h2>${esc(V.name)}</h2><div class="list">
  <div class="row"><span>${t('radius')}</span><b class="num">${V.radius??100}</b></div>
  <div class="row"><span>${t('grace')}</span><b class="num">${V.grace??10}</b></div>
  <div class="row"><span>${t('cutoff')}</span><b class="num ltr">${esc(V.cutoff||'05:00')}</b></div>
  <div class="row"><span>${t('pingTypesShort')}</span><span class="mute" style="text-align:end">${(V.pingTypes||[]).map(esc).join(lang==='ar'?'، ':', ')}</span></div>
  <div class="row"><span>${t('alertTypesShort')}</span><span class="mute" style="text-align:end">${(V.alertTypes||[]).map(esc).join(lang==='ar'?'، ':', ')}</span></div></div>
  <button class="btn block" style="margin-top:10px" data-a="setSheet">${t('editSet')}</button></div>
  <div class="card g"><h2 style="margin:0">${t('location')}</h2><div class="mute">${V.lat==null?t('locNot'):t('locSet')}</div><button class="btn fill" data-a="setLoc">${t('setLoc')}</button></div>
  <div class="card g"><h2 style="margin:0">${t('account')}</h2><div class="mute ltr">${esc((auth.currentUser&&auth.currentUser.email)||'')}</div><button class="btn" data-a="passSheet">${t('changePass')}</button><a href="privacy.html" style="text-align:center">${t('privacy')}</a></div>`}
function setSheet(){openSheet(`<h2>${t('editSet')}</h2><div class="g"><label class="f">${t('vname')}<input id="xn" maxlength="40" value="${esc(V.name)}"></label><div class="two"><label class="f">${t('radius')}<input id="rd" type="number" inputmode="numeric" value="${V.radius??100}"></label><label class="f">${t('grace')}<input id="gr" type="number" inputmode="numeric" value="${V.grace??10}"></label></div><label class="f">${t('cutoff')}<input id="co" type="time" value="${esc(V.cutoff||'05:00')}"></label><div class="mute">${t('cutoffHint')}</div><label class="f">${t('alertTypes')}<textarea id="at">${esc((V.alertTypes||[]).join('\n'))}</textarea></label><label class="f">${t('pingTypes')}<textarea id="pt">${esc((V.pingTypes||[]).join('\n'))}</textarea></label><button class="btn fill" data-a="saveSet">${t('save')}</button></div>`)}
async function saveSet(){const nm=$('xn').value.trim()||V.name,r=Math.min(2000,Math.max(20,+$('rd').value||100)),g=Math.min(120,Math.max(0,+$('gr').value||0)),co=$('co').value||'05:00';
  const at=$('at').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,8),pt=$('pt').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,8);
  await updateDoc(vref(),{name:nm,radius:r,grace:g,cutoff:co,alertTypes:at.length?at:defaultAlerts(),pingTypes:pt.length?pt:defaultPings()});closeSheet();say(t('saved'))}
async function setLoc(){const c=(await getPos()).coords;await withTimeout(updateDoc(vref(),{lat:c.latitude,lng:c.longitude}));say(t('locOk'))}

/* ---------- shared actions ---------- */
function passSheet(){openSheet(`<h2>${t('changePass')}</h2><div class="g"><input id="cp" type="password" placeholder="${t('curPass')}" autocomplete="current-password"><input id="np" type="password" placeholder="${t('newPass')}" autocomplete="new-password"><button class="btn fill" data-a="changePass">${t('save')}</button></div>`)}
async function changePass(){const cur=$('cp').value,nw=$('np').value;if(!cur||nw.length<6)return smsg(t('eWeak'));const u=auth.currentUser;
  await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,cur));await updatePassword(u,nw);closeSheet();say(t('passOk'))}
function consentSheet(){openSheet(`<h2>${t('consentTitle')}</h2><p>${t('consentText')}</p><p><a href="privacy.html">${t('privacy')}</a></p><button class="btn fill block" data-a="consentOk">${t('agree')}</button>`)}
async function punch(){if(subInfo().state==='blocked')return say(t('subBlockedStaff'),1);if(!navigator.onLine)return say(t('offline'),1);const o=myOpen();if(!o&&!lsGet('hadir-consent')){consentSheet();return}
  if(o){await withTimeout(updateDoc(doc(db,'venues',V.id,'logs',o.id),{outAt:serverTimestamp()}));return say(t('outOk'))}
  if(V.lat==null)return say(t('noLoc'),1);say(t('checking'));
  const c=(await getPos()).coords,d=Math.round(dist(c,{latitude:V.lat,longitude:V.lng})),acc=Math.round(c.accuracy||0),R=V.radius??100;
  if(d-Math.min(acc,75)>R)return say(t('far',d,R),1);
  await withTimeout(addDoc(col('logs'),{uid:U.uid,name:myName(),inAt:serverTimestamp(),outAt:null,dist:d,acc}));say(t('inOk'))}
function alertSheet(){const ty=(V.alertTypes&&V.alertTypes.length)?V.alertTypes:defaultAlerts();
  openSheet(`<h2>${t('alertTitle')}</h2><div class="chips">${ty.map((x,i)=>`<button type="button" class="chip ach" data-a="achip" data-v="${esc(x)}" aria-pressed="${i===0}">${esc(x)}</button>`).join('')}</div><input id="an" style="margin-top:10px" maxlength="120" placeholder="${t('alertNote')}"><button class="btn bad fill block" style="margin-top:12px" data-a="sendAlert">${t('send')}</button>`)}
async function sendAlert(){if(Date.now()-lastAlertAt<6e4)return smsg(t('alertWait'));const o=myOpen();if(!o){closeSheet();return}
  const sel=document.querySelector('#sheet .ach[aria-pressed="true"]'),type=sel?sel.dataset.v:defaultAlerts()[0];
  await withTimeout(addDoc(col('alerts'),{uid:U.uid,name:myName(),type,note:$('an').value.trim().slice(0,120),logId:o.id,at:serverTimestamp(),ackAt:null}));
  lastAlertAt=Date.now();lsSet('hadir-la',String(lastAlertAt));closeSheet();say(t('alertSent'))}
async function tick(b){const id=b.dataset.id,bd=bizDate(Date.now()),did=bd+'_'+ltype,c=checks.find(z=>z.id===did),on=!!(c&&c.done&&c.done[id]);
  await setDoc(doc(db,'venues',V.id,'checks',did),{date:bd,type:ltype,done:{[id]:on?deleteField():{by:U.uid,name:myName(),at:serverTimestamp()}}},{merge:true})}
const loadingView=()=>{$('app').innerHTML=`<div class="card" style="text-align:center;padding:28px"><div class="spin"></div><div class="mute">${t('signingIn')}</div></div>`};
async function doLogin(){const em=mode==='staff'?$('un').value.trim().toLowerCase()+'.'+$('vc').value.trim().toLowerCase()+'@hadir.app':$('em').value.trim(),pw=$('pw').value;
  const keep={vc:$('vc')&&$('vc').value,un:$('un')&&$('un').value,em:$('em')&&$('em').value};
  if(!em||!pw)return say(t('fillAll'),1);say('');loadingView();
  try{await signInWithEmailAndPassword(auth,em,pw)}catch(e){loginView();Object.entries(keep).forEach(([k,v])=>{if(v&&$(k))$(k).value=v});throw e}}
async function doSignup(){const vn=$('vn2').value.trim(),nm=$('nm').value.trim(),em=$('em').value.trim(),pw=$('pw').value;
  if(!vn||!nm||!em||pw.length<6)return say(t('fillAll'),1);creating=true;
  try{let c;try{c=await createUserWithEmailAndPassword(auth,em,pw)}catch(e){if(e.code==='auth/email-already-in-use')c=await signInWithEmailAndPassword(auth,em,pw);else throw e}
    const ex=await getDoc(doc(db,'users',c.user.uid));
    if(!ex.exists()){const code=Array.from({length:6},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.random()*31|0]).join('');
      const v=await addDoc(collection(db,'venues'),{name:vn,code,ownerUid:c.user.uid,lat:null,lng:null,radius:100,grace:10,cutoff:'05:00',status:'pending',lists:defaultLists(),alertTypes:defaultAlerts(),pingTypes:defaultPings()});
      await setDoc(doc(db,'users',c.user.uid),{role:'admin',venueId:v.id,name:nm})}
    creating=false;await boot(c.user)}catch(e){creating=false;throw e}}

/* ---------- render / boot ---------- */
function render(){header();alertBar();if(!U)return;const a=document.activeElement;if(a&&$('app').contains(a)&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;
  const si=subInfo();RO=si.state==='blocked';
  if(U.role!=='admin'&&RO){$('app').innerHTML=`<div class="card" style="text-align:center;padding:28px"><div style="font-size:2rem">⛔</div><p>${t('subBlockedStaff')}</p></div>`;return}
  if(U.role==='admin'){let T=[['now',t('aNow')],['team',t('aTeam')],['lists',t('aLists')],['rep',t('aRep')],['set',t('aSet')]];
    if(RO)T=[['rep',t('aRep')],['set',t('aSet')]];
    if(isBoss())T.push(['boss',t('aBoss')]);
    if(!T.some(x=>x[0]===tab))tab=T[0][0];
    const views={now:viewNow,team:viewTeam,lists:()=>listsView(true),rep:viewReport,set:viewSettings,boss:viewBoss};
    const wl=`<a href="${waLink()}" target="_blank" rel="noopener">${t('renew')}</a>`;
    let ban='';if(si.state==='soon')ban=`<div class="card"><div class="msg err" style="min-height:0">${t('subSoon',si.days)}</div>${wl}</div>`;
    else if(si.state==='grace')ban=`<div class="card"><div class="msg err" style="min-height:0">${t('subGrace',dateS(si.pu))}</div>${wl}</div>`;
    else if(RO)ban=`<div class="card"><div class="msg err" style="min-height:0">${si.pending?'⏳ '+t('subPending'):'⛔ '+t('subBlocked')}</div>${wl}</div>`;
    $('app').innerHTML=tabs(T,tab,'tab')+ban+views[tab]()}
  else staffView()}
let bootSeq=0;
const clearSessions=()=>{try{Object.keys(localStorage).filter(k=>k.startsWith('hadir-s-')).forEach(k=>localStorage.removeItem(k))}catch(e){}};
const saveSession=()=>{if(U&&V)lsSet('hadir-s-'+U.uid,JSON.stringify({U,V}))};
async function boot(u){stop();const my=++bootSeq;if(!u){clearSessions();return loginView()}
  let c=null;try{c=JSON.parse(lsGet('hadir-s-'+u.uid)||'null')}catch(e){}
  if(c&&c.U&&c.V&&c.U.uid===u.uid){start(c.U,c.V);
    getDoc(doc(db,'users',u.uid)).then(us=>{if(my!==bootSeq)return;if(!us.exists()){clearSessions();signOut(auth);return}const nu={uid:u.uid,...us.data()};
      if(nu.venueId!==c.U.venueId||nu.role!==c.U.role){lsSet('hadir-s-'+u.uid,'');boot(u)}else{U=nu;saveSession()}}).catch(()=>{});return}
  loadingView();
  try{const us=await getDoc(doc(db,'users',u.uid));if(my!==bootSeq)return;if(!us.exists()){await signOut(auth);loginView();return say(t('notLinked'),1)}
    const U0={uid:u.uid,...us.data()};const vs=await getDoc(doc(db,'venues',U0.venueId));if(my!==bootSeq)return;
    start(U0,{id:vs.id,...vs.data()});saveSession()}catch(e){if(my!==bootSeq)return;loginView();say(errT(e),1)}}
function start(U0,V0){stop();U=U0;V=V0;bootAt=Date.now();say('');
    sub(vref(),s=>{if(s.exists()){V={id:s.id,...s.data()};saveSession();render()}});
    if(U.role==='admin'){const patch={};if(V.cutoff==null)patch.cutoff='05:00';if(V.grace==null)patch.grace=10;if(V.radius==null)patch.radius=100;if(!V.lists)patch.lists=defaultLists();if(!V.alertTypes)patch.alertTypes=defaultAlerts();if(!V.pingTypes)patch.pingTypes=defaultPings();
      if(Object.keys(patch).length){Object.assign(V,patch);updateDoc(vref(),patch).catch(e=>say(errT(e),1))}
      sub(col('staff'),s=>{staff=s.docs.map(d=>({...d.data(),id:d.id}));render()});
      const n=new Date(),ls=new Date(n.getFullYear(),n.getMonth(),1);ls.setDate(ls.getDate()-2);
      sub(query(col('logs'),where('inAt','>=',ls)),s=>{logs=s.docs.map(norm);render()});
      sub(query(col('alerts'),where('at','>=',new Date(Date.now()-864e5))),s=>{s.docChanges().forEach(c=>{if(c.type==='added'){const a=nal(c.doc);if(!a.ackAt&&a.at>bootAt-5000)beep()}});alerts=s.docs.map(nal);render()});
      const d9=new Date();d9.setDate(d9.getDate()-9);
      sub(query(col('checks'),where('date','>=',ymd(d9))),s=>{checks=s.docs.map(nck);render()});
      sub(query(col('pings'),where('at','>=',new Date(Date.now()-864e5))),s=>{pings=s.docs.map(npg);render()});
      sub(query(col('audit'),where('at','>=',new Date(Date.now()-70*864e5))),s=>{audit=s.docs.map(nau);if(curPerson&&sheetOpen()&&document.activeElement===document.body)personSheet(curPerson)});
    }else{
      sub(doc(db,'venues',V.id,'staff',U.uid),s=>{ME=s.data()||{};if(ME.active===false){clearSessions();signOut(auth).then(()=>say(t('suspended'),1));return}render()});
      sub(query(col('logs'),where('uid','==',U.uid)),s=>{logs=s.docs.map(norm);render()});
      sub(query(col('alerts'),where('uid','==',U.uid)),s=>{alerts=s.docs.map(nal);render()});
      sub(query(col('pings'),where('to','==',U.uid)),s=>{s.docChanges().forEach(c=>{if(c.type==='added'){const p=npg(c.doc);if(!p.seenAt&&p.at>bootAt-5000)beep()}});pings=s.docs.map(npg);render()});
      const d2=new Date();d2.setDate(d2.getDate()-2);
      sub(query(col('checks'),where('date','>=',ymd(d2))),s=>{checks=s.docs.map(nck);render()});
    }
    render()}
onAuthStateChanged(auth,u=>{if(!creating)boot(u)});
setInterval(render,30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&U&&Date.now()-bootAt>12*36e5)boot(auth.currentUser);else if(document.visibilityState==='visible')render()});

/* ---------- actions ---------- */
const guard=f=>async b=>{if(busy)return;busy=true;if(b)b.disabled=true;try{await f(b)}catch(e){const m=errT(e);if(sheetOpen()&&$('smsg'))smsg(m);else say(m,1)}finally{busy=false;if(b&&b.isConnected)b.disabled=false}};
const A={
  lang:()=>{lang=lang==='ar'?'en':'ar';lsSet('hadir-lang',lang);applyLang();if(sheetOpen())closeSheet();U?render():loginView()},
  logout:()=>{closeSheet();clearSessions();signOut(auth)},
  mode:b=>{mode=b.dataset.k;say('');loginView()},
  tab:b=>{tab=b.dataset.k;if(tab==='boss')bossList=null;render();scrollTo(0,0)},
  stab:b=>{stab=b.dataset.k;render()},
  ltype:b=>{ltype=b.dataset.k;render()},
  goLists:b=>{ltype=b.dataset.k;tab='lists';render();scrollTo(0,0)},
  dismiss:b=>{lsSet('hadir-d-'+b.dataset.k,'1');render()},
  closeSheet:()=>closeSheet(),
  chip:b=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true'),
  achip:b=>{document.querySelectorAll('#sheet .ach').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')},
  login:guard(doLogin),signup:guard(doSignup),punch:guard(punch),
  tick:guard(tick),listSheet:()=>listSheet(),
  lmv:b=>{const k=+b.dataset.k,d=+b.dataset.d,j=k+d;if(j<0||j>=draft.length)return;[draft[k],draft[j]]=[draft[j],draft[k]];renderListSheet()},
  ldel:b=>{draft.splice(+b.dataset.k,1);renderListSheet()},
  ladd:()=>{const v=$('ni').value.trim();if(!v)return;draft.push({id:'i'+rid(),t:v.slice(0,120)});renderListSheet();setTimeout(()=>{const n=$('ni');if(n)n.focus()},0)},
  lsave:guard(async()=>{await updateDoc(vref(),{['lists.'+ltype]:draft});closeSheet();say(t('saved'))}),
  ack:guard(async b=>{await updateDoc(doc(db,'venues',V.id,'alerts',b.dataset.id),{ackAt:serverTimestamp(),ackBy:myName()})}),
  shareCode:()=>shareText(t('inviteCode',APP_URL,V.code)),
  shareInvite:()=>shareText(lastInvite),
  addSheet:()=>openSheet(`<h2>${t('addStaff').replace('+ ','')}</h2>${staffForm(null)}<button class="btn fill block" style="margin-top:12px" data-a="addStaff">${t('save')}</button>`),
  addStaff:guard(addStaff),staffSheet:b=>staffSheet(b.dataset.id),saveStaff:guard(saveStaff),toggleStaff:guard(toggleStaff),
  reissueSheet:()=>reissueSheet(),reissue:guard(reissue),
  mprev:()=>{repM--;if(repM<0){repM=11;repY--}render()},
  mnext:()=>{if(isCurMonth())return;repM++;if(repM>11){repM=0;repY++}render()},
  person:b=>personSheet(b.dataset.id),editLog:b=>editLogSheet(b.dataset.id),saveLog:guard(saveLog),
  manualSheet:b=>manualSheet(b.dataset.id),saveManual:guard(saveManual),
  backPerson:()=>{curPerson?personSheet(curPerson):closeSheet()},
  shareRep:()=>shareRep(),csv:()=>exportCSV(),
  setSheet:()=>setSheet(),saveSet:guard(saveSet),setLoc:guard(setLoc),
  passSheet:()=>passSheet(),changePass:guard(changePass),
  alertSheet:()=>alertSheet(),sendAlert:guard(sendAlert),
  bExt:guard(bExt),bTog:guard(bTog),
  pingSheet:b=>pingSheet(b.dataset.id),sendPing:guard(sendPing),
  seen:guard(async b=>{await updateDoc(doc(db,'venues',V.id,'pings',b.dataset.id),{seenAt:serverTimestamp()})}),
  consentOk:()=>{lsSet('hadir-consent','1');closeSheet();A.punch(null)}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){e.preventDefault();A[b.dataset.a](b)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[role=button]')){e.preventDefault();e.target.click();return}
  if(e.key==='Enter'&&e.target.id==='ni'){e.preventDefault();A.ladd();return}
  if(e.key==='Enter'&&e.target.tagName==='INPUT'){const f=e.target.closest('#app,#sheet');const btn=f&&f.querySelector('.btn.fill:not([disabled])');if(btn){e.preventDefault();btn.click()}}
  if(e.key==='Escape'&&sheetOpen())closeSheet()});
</script>
</body>
