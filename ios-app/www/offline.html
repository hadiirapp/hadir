<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hadir</title>
<style>html,body{margin:0;height:100%;background:#0B0F10;color:#E8F1EF;font-family:-apple-system,system-ui,sans-serif}
.w{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
.i{width:72px;height:72px;border-radius:20px;background:rgba(127,224,207,.12);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
h1{font-size:1.25rem;margin:0 0 8px}p{color:#8FA19C;margin:0 0 22px;line-height:1.5}
button{background:#7FE0CF;color:#06211C;border:0;border-radius:14px;padding:14px 26px;font-size:1rem;font-weight:700}</style></head>
<body><div class="w"><div class="i"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#7FE0CF" stroke-width="2" stroke-linecap="round"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.6a10 10 0 0 1 14 0M8.5 16.4a5 5 0 0 1 7 0"/><circle cx="12" cy="20" r="1"/></svg></div>
<h1 id="t">No connection</h1><p id="s">Hadir needs internet to show your team live. Check your connection and try again.</p>
<button id="b" onclick="location.href='https://usehadir.com/?login=1'">Try again</button></div>
<script>if((navigator.language||'').startsWith('ar')){document.documentElement.dir='rtl';t.textContent='ما في انترنت';s.textContent='حاضر بدو انترنت ليورجيك فريقك مباشرة. تأكد من الاتصال وجرّب مرة تانية.';b.textContent='جرّب مرة تانية'}
addEventListener('online',()=>location.href='https://usehadir.com/?login=1')</script></body></html>
